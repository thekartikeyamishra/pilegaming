name: pile
description: "Pile — beat your backlog. Track every game you own, expose the pile of shame, and be ready (and funded) for the next big release."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.4
  share_plus: ^10.1.2
  screenshot: ^3.0.0
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  in_app_purchase: ^3.2.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0E1116"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  uses-material-design: true
